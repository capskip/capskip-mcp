name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub release
      id-token: write # required for npm Trusted Publishing (OIDC) + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Upgrade npm
        # npm Trusted Publishing (OIDC) requires npm >= 11.5.1.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: node --test

      - name: Publish to npm
        # Publishes via npm Trusted Publishing (OIDC) using the id-token permission
        # above — no NPM_TOKEN secret required. Build provenance is emitted too.
        run: npm publish --provenance --access public

      # Without this the tag ships to npm but never appears on the repo's
      # Releases page. Notes are auto-generated from merged PRs and can be
      # edited afterwards.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: CapSkip MCP Server ${{ github.ref_name }}
          generate_release_notes: true
